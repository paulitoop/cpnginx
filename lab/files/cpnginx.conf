user cpnginx;
worker_processes 1;
error_log /var/log/cpnginx/error.log notice;
pid /var/run/cpnginx.pid;
events { worker_connections 256; }
http {
    include /etc/opt/cprocsp/cpnginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr status=$status upstream=$upstream_status request="$request"';
    access_log /var/log/cpnginx/access.log main;
    sendfile on;
    include /etc/opt/cprocsp/cpnginx/conf.d/*.conf;
    include /etc/opt/cprocsp/cpnginx/conf.d/portals/*.conf;
}
