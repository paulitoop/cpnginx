name: cpnginx-demo
x-node: &node
  image: cpnginx-lab-gateway:local
  cpus: 1.0
  mem_limit: 512m
  volumes:
    - ${LAB_STATE_DIR}/ssh/id_ed25519.pub:/run/lab/authorized_keys:ro
  healthcheck:
    test: [CMD-SHELL, "pgrep -x sshd >/dev/null"]
    interval: 3s
    timeout: 3s
    retries: 30
services:
  proxy01:
    <<: *node
    ports:
      - 127.0.0.1:2221:22
      - 127.0.0.1:18080:30443
  proxy02:
    <<: *node
    profiles: [two]
    ports:
      - 127.0.0.1:2222:22
      - 127.0.0.1:18081:30443
  partner:
    image: cpnginx-lab-ubuntu:local
    entrypoint: [python3, /usr/local/bin/lab-partner.py]
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - ${LAB_STATE_DIR}/assets/server.pfx:/run/lab/server.pfx:ro
      - ${LAB_STATE_DIR}/assets/server.pin:/run/lab/server.pin:ro
      - ${LAB_STATE_DIR}/partner-auth:/run/lab-vault:ro
      - ${LAB_STATE_DIR}/assets/ca:/run/lab/ca:ro
    ports:
      - 127.0.0.1:15100:5100
      - 127.0.0.1:15101:5101
    networks:
      default:
        aliases: [cpnginx.example.test]
    healthcheck:
      test: [CMD-SHELL, "pgrep cpnginx >/dev/null && /opt/cprocsp/sbin/amd64/cpnginx -t && ! grep -q AcquireCredentialsHandle /var/log/cpnginx/error.log"]
      interval: 3s
      timeout: 3s
      retries: 30
  vault:
    image: hashicorp/vault:1.16.3
    cpus: 0.5
    mem_limit: 256m
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    command: server
    volumes:
      - ./files/vault.hcl:/vault/config/lab.hcl:ro
      - vault-data:/vault/file
    ports: [127.0.0.1:18200:8200]
    healthcheck:
      test: [CMD-SHELL, "vault status >/dev/null 2>&1; s=$$?; test $$s -eq 0 -o $$s -eq 2"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  vault-data:
