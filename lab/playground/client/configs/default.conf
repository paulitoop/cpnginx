server {
    listen       8081;
    server_name  nginx-client.example.test;
    location / {
        root   /var/opt/cprocsp/cpnginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /var/opt/cprocsp/cpnginx/html;
    }

}
