server {
    listen       8080 sspi;
    server_name  _;
    sspi_certificate {{ cert_serial }};
    sspi_protocols TLSv1.2;
    #access_log  /var/log/cpnginx/host.access.log  main;

    location / {
        root   /var/opt/cprocsp/cpnginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /var/opt/cprocsp/cpnginx/html;
    }

}
